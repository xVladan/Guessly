services:
  guessly-api:
    build: ./Guessly.Api
    container_name: guessly-api
    restart: always
    ports:
      - "5060:5000"
    environment:
      - PORT=5000
      # TODO: update once the frontend's real domain is decided (Cloudflare Pages
      # custom domain, e.g. https://play.weddio.net) — localhost stays for local testing.
      - ALLOWED_ORIGINS=https://play.weddio.net,http://localhost:5500

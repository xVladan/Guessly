# Guessly API - nginx reverse proxy
# Putanja na serveru: /etc/nginx/sites-available/guessly-api.weddio.net
# Ovo je POCETNI (HTTP-only) blok. Certbot ce automatski dodati 443 + redirect,
# isto kao za api.weddio.net i mmtc-api.weddio.net.
#
# Napomena: Cloudflare "real IP" (set_real_ip_from ...) je vec globalno podesen,
# ne ponavljamo ga ovdje - vazi za sve server blokove.
#
# Za razliku od Weddio/MMTC API-ja, Guessly koristi SignalR (WebSocket) za
# real-time komunikaciju, pa su Upgrade/Connection header-i OBAVEZNI ovdje -
# bez njih SignalR konekcija tiho ne radi ili pada na long-polling.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name guessly-api.weddio.net;

    location / {
        proxy_pass         http://localhost:5060;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SignalR drzi dugotrajnu konekciju otvorenu - ne prekidati je prerano.
        proxy_read_timeout 100s;
        proxy_send_timeout 100s;
    }
}
